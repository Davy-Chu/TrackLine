name: trackline

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-trackline}
      POSTGRES_USER: ${POSTGRES_USER:-trackline}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-trackline}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      TRACKLINE_ENVIRONMENT: development
      TRACKLINE_API_HOST: 0.0.0.0
      TRACKLINE_API_PORT: 8000
      TRACKLINE_DATABASE_URL: postgresql://${POSTGRES_USER:-trackline}:${POSTGRES_PASSWORD:-trackline}@db:5432/${POSTGRES_DB:-trackline}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  worker:
    build:
      context: ./backend
    command: python -m jobs.worker
    environment:
      TRACKLINE_ENVIRONMENT: development
      TRACKLINE_DATABASE_URL: postgresql://${POSTGRES_USER:-trackline}:${POSTGRES_PASSWORD:-trackline}@db:5432/${POSTGRES_DB:-trackline}
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    command: npm run dev -- --hostname 0.0.0.0
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      backend:
        condition: service_healthy

volumes:
  frontend_node_modules:
  postgres_data:
