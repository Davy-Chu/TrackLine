[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "trackline-backend"
version = "0.1.0"
description = "Trackline FastAPI backend development foundation"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.139.2",
    "pydantic-settings==2.15.0",
    "uvicorn[standard]==0.51.0",
]

[project.optional-dependencies]
dev = [
    "httpx2==2.9.0",
    "mypy==2.3.1",
    "pytest==9.1.1",
    "ruff==0.16.3",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["api*", "database*", "domain*", "jobs*", "llm*", "research*", "sources*"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "SIM", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["api", "database", "domain", "jobs", "llm", "research", "sources", "tests"]
